services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint
      POSTGRES_DB: pinpoint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpoint"]
      interval: 5s
      retries: 10
  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://pinpoint:pinpoint@db:5432/pinpoint
      DATA_DIR: /data
    ports:
      - "8787:8787"
    volumes:
      - files:/data
volumes:
  pgdata:
  files:
