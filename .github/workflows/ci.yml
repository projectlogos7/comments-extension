name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package extension
        run: npm run zip -w extension
      - uses: actions/upload-artifact@v4
        with:
          name: pinpoint-extension
          path: extension/pinpoint-extension.zip
